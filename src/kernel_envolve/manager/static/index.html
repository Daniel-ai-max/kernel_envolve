<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>kernel envolve · 持续优化</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <div>
          <span class="eyebrow">KERNEL ENVOLVE / OPTIMIZATION</span>
          <h1>持续优化工作台</h1>
        </div>
        <div id="updated" role="status">正在连接…</div>
      </header>
      <nav aria-label="主导航">
        <button data-view="overview" aria-pressed="true">算子总览</button
        ><button data-view="resources" aria-pressed="false">计算资源</button
        ><button id="refresh">刷新</button>
      </nav>
      <div id="error" role="alert" hidden></div>
      <section id="metrics" aria-label="整体状态"></section>
      <section id="overview">
        <div class="section-head">
          <h2>算子任务</h2>
          <label
            >筛选
            <input id="search" type="search" placeholder="算子、版本、状态"
          /></label>
        </div>
        <div class="scroll">
          <table>
            <thead>
              <tr>
                <th>算子 / 目标</th>
                <th>当前阶段</th>
                <th>原始 baseline</th>
                <th>实现提出时间</th>
                <th>已验证加速</th>
                <th>最近晋升</th>
                <th>验证范围</th>
                <th>GPU / 资源</th>
                <th>当前方向</th>
              </tr>
            </thead>
            <tbody id="tasks"></tbody>
          </table>
        </div>
        <p id="empty" class="empty" hidden>尚未注册任务</p>
      </section>
      <section id="resources" hidden>
        <div class="section-head"><h2>资源与等待队列</h2></div>
        <div id="resource-list"></div>
      </section>
      <section id="detail" hidden aria-label="算子详情"></section>
    </main>
  </body>
</html>
