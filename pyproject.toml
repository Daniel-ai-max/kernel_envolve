[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kernel-envolve"
version = "0.3.1"
description = "A skill and a reproducible evaluator for agent-driven kernel iteration"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "pyyaml>=6"]
cuda = ["torch>=2.5", "triton>=3.1; sys_platform == 'linux'"]

[project.scripts]
kernel-envolve = "kernel_envolve.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
