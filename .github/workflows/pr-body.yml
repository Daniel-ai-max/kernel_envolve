name: PR body gate

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to validate
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-body-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate PR template
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only run the trusted default-branch checker, never code from the PR head.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Fetch current PR description
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid PR number"; exit 1; }
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "$RUNNER_TEMP/pull-request.json"

      - name: Validate PR description
        run: python3 tools/check_pr_body.py --pr-file "$RUNNER_TEMP/pull-request.json"
